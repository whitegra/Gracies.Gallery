<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
    <title>{{ artwork.title }}</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            text-align: center;
        }
        .side-margins {
            background-color: {{ artwork.side_margin_color }}; /* Dynamic color */
            height: 100%;
            width: 100px; /* Width of the side margins */
            position: absolute;
            top: 0;
            bottom: 0;
        }
        .left-margin {
            left: 0;
        }
        .right-margin {
            right: 0;
        }
        .artwork-content {
            margin: 0 auto;
            max-width: 50%;
            padding: 20px;
            position: relative;
            z-index: 1;
            background-color: white; /* Ensure the artwork stands out */
        }
        .artwork-content img {
            max-width: 50%; /* Scale all images to 50% of the container */
            height: auto;    /* Maintain aspect ratio */
            display: block;  /* Center the image */
            margin: 20px auto; /* Add spacing and center */
            border: 2px solid #ccc;
            border-radius: 10px; /* Rounded corners */
        }
        .description {
            font-size: 24px;
            color: #333;
            text-align: center;
        }
        .back-link {
            display: inline-block;
            text-decoration: none;
            color: #333;
            border: 1px solid #ccc;
            padding: 10px 15px;
            border-radius: 5px;
            transition: background-color 0.2s;
        }
        .back-link:hover {
            background-color: #ddd;
        }
    </style>
</head>
<body>
    <!-- Left Side Margin -->
    <div class="side-margins left-margin"></div>
    <!-- Right Side Margin -->
    <div class="side-margins right-margin"></div>

    <!-- Main Artwork Content -->
    <div class="artwork-content">
        <h1>{{ artwork.title }}</h1>
        <img src="{{ url_for('static', filename='uploads/' + artwork.filename) }}" alt="{{ artwork.title }}">
        <p class="description">{{ artwork.description }}</p>
        <a class="back-link" href="{{ url_for('index') }}">Back to Gallery</a>
    </div>
</body>
</html>
